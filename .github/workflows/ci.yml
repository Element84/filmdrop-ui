name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check-markdown
      - run: npm run lint
      - run: npm run format
      - run: npm run typecheck
      - run: npm run test-pre-commit
      - name: Build SPA
        run: npm run build
      - name: Build library
        run: npm run build:lib
      - name: Bundle size budget
        run: |
          node -e "const fs=require('fs');const s=fs.statSync('dist/filmdrop-ui.js').size;const MAX=1600000;console.log('lib size:',s);if(s>MAX){console.error('dist/filmdrop-ui.js exceeds bundle budget:',s,'>',MAX);process.exit(1)}"
          node -e "const fs=require('fs');const s=fs.statSync('dist/style.css').size;const MAX=120000;console.log('css size:',s);if(s>MAX){console.error('dist/style.css exceeds bundle budget:',s,'>',MAX);process.exit(1)}"
      - name: Publish dry-run
        run: npm publish --dry-run

  # Supply-chain advisories on production deps. Non-blocking on CI to
  # avoid red-lighting every PR on transitive advisories we cannot
  # fix immediately; failures still surface in the Actions UI. The
  # release workflow runs the same check as a BLOCKING gate before
  # publish. Revisit in Phase 4: move to blocking here once the
  # ignore list stabilizes.
  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run audit-prod
